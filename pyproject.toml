[project]
name = "jade-muse-web-github-io"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dallin Anderson", email = "bakerdda@byu.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "arviz>=1.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "nutpie>=0.16.11",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pymc>=6.4.0",
    "pyyaml>=6.0.3",
    "quarto>=0.1.0",
]

[project.scripts]
jade-muse-web-github-io = "jade_muse_web_github_io:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
